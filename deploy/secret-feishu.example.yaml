apiVersion: v1
kind: Secret
metadata:
  name: k8s-inspector-feishu
  namespace: kube-system
type: Opaque
stringData:
  # app 模式必须：企业自建应用
  app_id: "YOUR_APP_ID"
  app_secret: "YOUR_APP_SECRET"
  # 需要被自动拉进告警群的成员 open_id（逗号分隔）
  alert_user_open_ids: "ou_xxx,ou_yyy"
  # webhook 模式可选：群自定义机器人 webhook（仅推送固定群）
  feishu_webhook: ""
